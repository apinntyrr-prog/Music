name: Build Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Music project
        run: |
          unzip -q Music_WebView_APK_Project.zip -d music_project
          echo "Project extracted:"
          find music_project -maxdepth 2 -type f | head -50

      - name: Find project folder
        run: |
          PROJECT_DIR=$(find music_project -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Music APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload Music APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Music-APK
          path: '**/build/outputs/apk/debug/*.apk'
